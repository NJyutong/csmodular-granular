<h2>为 CsModular 安装微粒（Pulvis）</h2>
<p>本安装包将为 CsModular 安装 <strong>微粒（Pulvis）</strong> 颗粒合成插件库（包含<em>颗粒冻结</em>、<em>颗粒采样</em>与<em>颗粒振荡器</em>）。</p>
<p>继续前请先关闭 <strong>CsModular</strong>。若 CsModular 位于 <code>/Applications/CsModular.app</code>，插件将自动注册到宿主的模块列表中。</p>
