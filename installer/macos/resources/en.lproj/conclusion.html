<h2>Pulvis is ready</h2>
<p>Open <strong>CsModular</strong> — Pulvis will appear automatically in the module list.</p>
<p>If CsModular is located in a custom folder, run in Terminal:</p>
<p><code>pulvis-install /path/to/CsModular.app</code></p>
<p>To uninstall later, run: <code>pulvis-install auto-uninstall</code></p>
