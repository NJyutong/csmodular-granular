<h2>Pulvis for CsModular</h2>
<p>This package installs the <strong>Pulvis</strong> granular synthesis plugin library (<em>Grain Freeze</em>, <em>Grain Sample</em>, and <em>Grain Osc</em>) for CsModular.</p>
<p>Please close <strong>CsModular</strong> before continuing. If CsModular is installed in <code>/Applications/CsModular.app</code>, Pulvis will be registered automatically.</p>
