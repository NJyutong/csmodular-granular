<h2>«Пульвис» готов к работе</h2>
<p>Откройте <strong>CsModular</strong> — плагин автоматически появится в списке модулей.</p>
<p>Если CsModular установлен в другую папку, выполните в Терминале:</p>
<p><code>pulvis-install /путь/к/CsModular.app</code></p>
<p>Для удаления выполните: <code>pulvis-install auto-uninstall</code></p>
</body>
